name = "DatingAlgo"
version = "0.1.0"
defaultTargets = ["DatingAlgo"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

# Pinned to a Mathlib release so everyone builds against the same version.
# The matching Lean version is in lean-toolchain; bump both together.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "DatingAlgo"
